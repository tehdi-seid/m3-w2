<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>weather app</title>
</head>

<body class="main-body">
  <h1>weather app</h1>
  <form>
    <input id="input-country" type="text" placeholder="Enter a country" />
    <button id="get-weather-btn">get-weather</button>
  </form>

  <section class="main">
    <div class="wrapper">
      <p class="recomending-text">Enter a country to get a weather</p>
    </div>
  </section>

  <section class="forecast-wraper">
    <h3>for the future 7 days</h3>
    <div class="future-forecast"></div>
  </section>
  <script type="module" src="./index.js"></script>
</body>

</html>
